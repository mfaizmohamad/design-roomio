name: Deploy public demo

# Every merge to main rebuilds the public demo (docs/public-demo.md) and publishes
# it to Cloudflare Pages as the PRODUCTION deployment: https://roomio-demo.pages.dev
#
# Tests are not re-run here: main only moves through PRs whose CI (ci.yml) passed.
# `npm run build:demo` still re-runs its own gates, and each one fails this job
# BEFORE anything is uploaded, leaving the previous deployment live:
#   - tsc -b                        type errors
#   - scripts/demo-leak-check.mjs   client name, scraped personal data, missing CSP
#   - scripts/size-check.mjs        3D engine un-split from the lazy chunk
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   API token with Account › Cloudflare Pages › Edit
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the roomio-demo Pages project
# Optional repository variable:
#   SENTRY_DSN             turns on client error reporting (src/demo/monitoring.ts)
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two quick merges must not race: an older build finishing last would overwrite
# the newer one. Queue instead, and never cancel an upload half-way through.
concurrency:
  group: deploy-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: build + deploy
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: https://roomio-demo.pages.dev
    steps:
      - uses: actions/checkout@v7

      # Without this a missing secret surfaces as a confusing wrangler auth error
      # AFTER a full build. Fail first, and say exactly what to set.
      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — see docs/public-demo.md"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # SENTRY_DSN is a repository VARIABLE, not a secret: a DSN only lets you submit
      # events and ships in the public JS anyway. Unset ⇒ the demo builds without
      # error reporting (and without the Sentry origin in its CSP).
      - name: Build demo (typecheck + leak check + size budget)
        run: npm run build:demo
        env:
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          VITE_RELEASE: ${{ github.sha }}

      # --branch roomio-main: Pages decides production vs preview by comparing this
      # to the project's PRODUCTION BRANCH setting, which was set to "roomio-main"
      # when the project was created. Passing "main" here would publish every
      # merge as a mere preview and leave roomio-demo.pages.dev on the old build.
      # If that setting is ever changed in the dashboard, change this to match.
      #
      # Wrangler is pinned to an exact version via npx rather than a marketplace
      # action: one less third-party action holding the Cloudflare token (same
      # reasoning as the gitleaks step in ci.yml). Bump it deliberately.
      # Wrangler 4.146 refuses to start on Node < 22 ("Wrangler requires at least
      # Node.js v22.0.0" — the first deploy run failed exactly here). The build
      # above stays on Node 20 so it matches ci.yml; only the upload needs 22.
      - name: Set up Node 22 for Wrangler
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.146.0 pages deploy dist-demo
          --project-name roomio-demo
          --branch roomio-main
          --commit-hash "$GITHUB_SHA"
          --commit-message "$(git log -1 --format=%s "$GITHUB_SHA")"
          --commit-dirty=true
